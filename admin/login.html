<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login</title>
  <link rel="stylesheet" href="admin.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #ffffff;
      font-family: 'Inter', Arial, sans-serif;
      color: #151b27;
      padding: 20px;
    }

    .login-shell {
      width: min(420px, 100%);
      background: #111827;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 32px 24px;
      box-shadow: 0 20px 40px rgba(17, 24, 39, 0.18);
    }

    .login-shell h1 {
      font-size: 26px;
      margin-bottom: 8px;
      text-align: center;
      color: #f3f4f6;
    }

    .login-shell p {
      text-align: center;
      color: #cbd5e1;
      margin-bottom: 24px;
      font-size: 13px;
    }

    .login-form {
      display: grid;
      gap: 16px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field label {
      font-size: 12px;
      font-weight: 700;
      color: #e5e7eb;
    }

    .field input {
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: #f3f4f6;
      padding: 12px 14px;
      font: inherit;
    }

    .field input:focus {
      outline: none;
      border-color: rgba(22, 140, 255, 0.65);
      box-shadow: 0 0 0 3px rgba(24, 143, 255, 0.15);
    }

    .login-btn {
      margin-top: 8px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #188fff, #f1cc26);
      color: #111;
      font-weight: 800;
      min-height: 46px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .login-btn:hover {
      transform: translateY(-1px);
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .login-shell {
        padding: 24px 18px;
      }

      .login-shell h1 {
        font-size: 22px;
      }

      .field input,
      .login-btn {
        min-height: 44px;
      }
    }

    .login-note {
      margin-top: 18px;
      font-size: 11px;
      text-align: center;
      color: #9aa2ad;
    }

    .login-error {
      min-height: 18px;
      color: #ff8080;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-shell">
    <h1>Admin Login</h1>
    <p>Enter your credentials to access the dashboard.</p>

    <form class="login-form" id="login-form">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" placeholder="enter Your Username" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter Your Password" required>
      </div>

      <button type="submit" class="login-btn">Login</button>
      <div class="login-error" id="login-error" aria-live="polite"></div>
    </form>

    <!-- <div class="login-note">Demo credentials: Darshil / admin123</div> -->
  </div>

  <script>
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');

    const validUser = 'Darshil';
    const validPass = 'admin123';

    if (localStorage.getItem('portfolioAdminLoggedIn') === 'true') {
      window.location.href = 'index.html';
    }

    loginForm.addEventListener('submit', function (event) {
      event.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (username === validUser && password === validPass) {
        localStorage.setItem('portfolioAdminLoggedIn', 'true');
        window.location.href = 'index.html';
        return;
      }

      loginError.textContent = 'Invalid username or password.';
      loginForm.reset();
    });
  </script>
</body>
</html>
